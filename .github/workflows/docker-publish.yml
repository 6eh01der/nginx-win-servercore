name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:

env:
  Version: "1.31.1.5%20SnowDrop"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-2022
            image_tag: "ltsc2022"
          - os: windows-2025
            image_tag: "ltsc2025"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build --build-arg VERSION="$ENV:Version" --build-arg IMAGE_VERSION=${{ matrix.image_tag }} -t ${{ github.actor }}/nginx-win:${{ matrix.image_tag }}-$($ENV:Version.split('%')[0]) .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ github.actor }}/nginx-win:${{ matrix.image_tag }}-$($ENV:Version.split('%')[0])
