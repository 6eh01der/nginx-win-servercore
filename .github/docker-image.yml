name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-2022
            context_dir: "./2022"
          - os: windows-2025
            context_dir: "./2025"

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build --build-arg VERSION="$ENV:Version" -t nginx-win-servercore ${{ matrix.context_dir }}
      env:
        Version: "1.31.1.5%20SnowDrop"
