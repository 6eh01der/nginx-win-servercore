name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build --build-arg VERSION="$ENV:Version" -t nginx-win-servercore ./2022
      env:
        Version: "1.31.1.5%20SnowDrop"
